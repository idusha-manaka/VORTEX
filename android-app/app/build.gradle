apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.vortex.rotator'
    compileSdk 33

    defaultConfig {
        applicationId "com.vortex.rotator"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
}
